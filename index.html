<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>INSTAX Mini Link 2 Web Editor</title>
    <!-- Collegamento al file CSS esterno -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>INSTAX Mini Link 2</h1>
    <p class="subtitle">Modifica e stampa senza App</p>
    
    <div class="card">
        <!-- 📶 CONNESSIONE BLUETOOTH -->
        <button id="connectButton">📶 Connetti Stampante</button>

        <!-- 📷 SCELTA FOTO -->
        <label id="photoButton" for="photoInput">📷 Scegli foto</label>
        <input id="photoInput" type="file" accept="image/*">

        <!-- EDITOR TOUCH / MOUSE -->
        <div id="editor" class="editor hidden">
            <img id="image" draggable="false" alt="">
            <div class="frame"></div>
            <div class="center-marker"></div>
        </div>

        <!-- 🔍 ZOOM SLIDER -->
        <div id="zoomArea" class="zoom-area hidden">
            <label for="zoom">🔍 Zoom</label>
            <input id="zoom" type="range" min="1" max="4" step="0.01" value="1">
        </div>

        <!-- AZIONI -->
        <button id="resetButton" class="hidden">↺ Ripristina posizione</button>
        <button id="printButton" class="hidden" disabled>🖨️ Invia Stampa (Instax)</button>

        <!-- INFORMAZIONI DI STATO -->
        <div id="info">Connetti la stampante o scegli una foto per iniziare.</div>
        <div id="status">Dispositivo non connesso</div>
    </div>
</div>

<!-- Collegamento al file JavaScript esterno -->
<script src="app.js"></script>
</body>
</html>
