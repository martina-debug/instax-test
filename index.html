<!DOCTYPE html> <html lang="it"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> <title>INSTAX Mini Link 2</title> <style> * { box-sizing: border-box; } body { margin: 0; padding: 20px 15px; background: #f3f3f3; font-family: Arial, sans-serif; color: #222; touch-action: manipulation; } .container { max-width: 500px; margin: auto; } h1 { text-align: center; margin: 5px 0; } .subtitle { text-align: center; color: #777; margin-top: 0; } .card { background: white; border-radius: 20px; padding: 20px; margin-top: 20px; box-shadow: 0 5px 20px #0002; } button, label { display: block; width: 100%; padding: 15px; margin-top: 12px; border: 0; border-radius: 12px; font-size: 16px; font-weight: bold; text-align: center; cursor: pointer; } #photoButton { background: #222; color: white; } #resetButton { background: #eee; } #photoInput { display: none; } /* * AREA DELL'EDITOR */ .editor { position: relative; /* * Rapporto 3:4 * come la foto INSTAX Mini */ width: 100%; aspect-ratio: 3 / 4; margin: 20px auto; overflow: hidden; background: #ddd; border-radius: 8px; /* * Importante per touch: * impedisce al browser di scorrere * la pagina mentre trascini la foto. */ touch-action: none; } /* * Immagine dentro la cornice */ #image { position: absolute; max-width: none; user-select: none; -webkit-user-select: none; pointer-events: none; transform-origin: center center; /* * Evita animazioni durante il trascinamento. */ will-change: transform; } /* * Cornice visiva */ .frame { position: absolute; inset: 0; pointer-events: none; border: 3px solid rgba(255,255,255,0.9); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.25); z-index: 10; } /* * Centro della foto */ .center-marker { position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; transform: translate(-50%, -50%); border-radius: 50%; border: 2px solid white; box-shadow: 0 0 3px black; opacity: 0.5; z-index: 20; } /* * Controllo zoom */ .zoom-area { margin-top: 15px; } .zoom-area label { margin: 0 0 8px; padding: 0; background: none; font-size: 14px; color: #666; } #zoom { width: 100%; } /* * Informazioni */ #info { margin-top: 15px; padding: 12px; background: #f1f1f1; border-radius: 10px; font-size: 14px; text-align: center; } #status { margin-top: 15px; padding: 12px; background: #eee; border-radius: 10px; text-align: center; font-size: 14px; } .hidden { display: none; } </style> </head> <body> <div class="container"> <h1>INSTAX Mini Link 2</h1> <p class="subtitle"> Modifica la foto </p> <div class="card"> <!-- SCELTA FOTO --> <label id="photoButton" for="photoInput"> 📷 Scegli foto </label>

<input
id="photoInput"
type="file"
accept="image/*"

<!-- EDITOR --> <div id="editor" class="editor hidden" >
<img
  id="image"
  draggable="false"
  alt=""
>

<div class="frame"></div>

<div class="center-marker"></div>

</div> <!-- ZOOM --> <div id="zoomArea" class="zoom-area hidden" >
<label for="zoom">
  🔍 Zoom
</label>

<input
  id="zoom"
  type="range"
  min="1"
  max="4"
  step="0.01"
  value="1"
>

</div> <!-- PULSANTI -->

<button
id="resetButton"
class="hidden"

↺ Ripristina posizione

</button> <!-- INFO --> <div id="info"> Scegli una foto per iniziare. </div> <div id="status"> Nessuna foto selezionata </div> </div> </div> <script> /* ===================================================== ELEMENTI ===================================================== */ const photoInput = document.getElementById("photoInput"); const editor = document.getElementById("editor"); const image = document.getElementById("image"); const zoom = document.getElementById("zoom"); const zoomArea = document.getElementById("zoomArea"); const resetButton = document.getElementById("resetButton"); const info = document.getElementById("info"); const status = document.getElementById("status"); /* ===================================================== STATO DELL'EDITOR ===================================================== */ let imageWidth = 0; let imageHeight = 0; let scale = 1; let x = 0; let y = 0; let startX = 0; let startY = 0; let startImageX = 0; let startImageY = 0; let dragging = false; /* * Per pinch zoom */ let pinchStartDistance = 0; let pinchStartScale = 1; /* ===================================================== CARICAMENTO FOTO ===================================================== */ photoInput.addEventListener( "change", () => { const file = photoInput.files[0]; if (!file) { return; } const url = URL.createObjectURL(file); image.onload = () => { imageWidth = image.naturalWidth; imageHeight = image.naturalHeight; editor.classList.remove("hidden"); zoomArea.classList.remove("hidden"); resetButton.classList.remove("hidden"); /* * Calcola lo zoom minimo necessario * per riempire la cornice. */ resetImage(); status.textContent = `${imageWidth} × ${imageHeight} px`; info.innerHTML = "👉 Trascina la foto per spostarla.<br>" + "🔍 Usa lo slider o il pinch per lo zoom."; URL.revokeObjectURL(url); }; image.src = url; } ); /* ===================================================== RESET ===================================================== */ function resetImage() { const editorWidth = editor.clientWidth; const editorHeight = editor.clientHeight; /* * Zoom minimo necessario per coprire * completamente la cornice. */ const scaleX = editorWidth / imageWidth; const scaleY = editorHeight / imageHeight; const minimumScale = Math.max(scaleX, scaleY); scale = minimumScale; /* * Partenza al centro. */ x = editorWidth / 2; y = editorHeight / 2; zoom.min = minimumScale; zoom.max = minimumScale * 4; zoom.value = minimumScale; updateImage(); } resetButton.addEventListener( "click", resetImage ); /* ===================================================== AGGIORNA IMMAGINE ===================================================== */ function updateImage() { image.style.width = imageWidth * scale + "px"; image.style.height = imageHeight * scale + "px"; image.style.left = x + "px"; image.style.top = y + "px"; image.style.transform = "translate(-50%, -50%)"; } /* ===================================================== SLIDER ZOOM ===================================================== */ zoom.addEventListener( "input", () => { const oldScale = scale; scale = parseFloat(zoom.value); /* * Mantiene il centro della foto * durante lo zoom. */ const factor = scale / oldScale; /* * Il punto centrale della cornice * rimane fisso. */ const centerX = editor.clientWidth / 2; const centerY = editor.clientHeight / 2; x = centerX + (x - centerX) * factor; y = centerY + (y - centerY) * factor; constrainPosition(); updateImage(); } ); /* ===================================================== MOUSE / TOUCH ===================================================== */ editor.addEventListener( "pointerdown", (event) => { /* * Se stiamo facendo pinch, * non iniziare il drag. */ if ( event.pointerType === "touch" && activePointers.size >= 2 ) { return; } dragging = true; startX = event.clientX; startY = event.clientY; startImageX = x; startImageY = y; editor.setPointerCapture( event.pointerId ); } ); editor.addEventListener( "pointermove", (event) => { if (!dragging) { return; } /* * Se abbiamo due dita, * il movimento è gestito dal pinch. */ if ( event.pointerType === "touch" && activePointers.size >= 2 ) { return; } x = startImageX + (event.clientX - startX); y = startImageY + (event.clientY - startY); constrainPosition(); updateImage(); } ); editor.addEventListener( "pointerup", (event) => { dragging = false; try { editor.releasePointerCapture( event.pointerId ); } catch {} } ); editor.addEventListener( "pointercancel", () => { dragging = false; } ); /* ===================================================== LIMITA IL MOVIMENTO ===================================================== */ function constrainPosition() { const width = imageWidth * scale; const height = imageHeight * scale; const editorWidth = editor.clientWidth; const editorHeight = editor.clientHeight; /* * L'immagine deve sempre coprire * tutta la cornice. */ const minX = editorWidth - width / 2; const maxX = width / 2; const minY = editorHeight - height / 2; const maxY = height / 2; x = Math.min( maxX, Math.max(minX, x) ); y = Math.min( maxY, Math.max(minY, y) ); } /* ===================================================== PINCH ZOOM ===================================================== */ const activePointers = new Map(); editor.addEventListener( "pointerdown", (event) => { activePointers.set( event.pointerId, { x: event.clientX, y: event.clientY } ); if (activePointers.size === 2) { dragging = false; pinchStartDistance = getPointerDistance(); pinchStartScale = scale; } } ); editor.addEventListener( "pointermove", (event) => { if ( !activePointers.has( event.pointerId ) ) { return; } activePointers.set( event.pointerId, { x: event.clientX, y: event.clientY } ); if (activePointers.size !== 2) { return; } const distance = getPointerDistance(); if (!pinchStartDistance) { return; } const factor = distance / pinchStartDistance; const newScale = pinchStartScale * factor; scale = Math.min( parseFloat(zoom.max), Math.max( parseFloat(zoom.min), newScale ) ); zoom.value = scale; constrainPosition(); updateImage(); } ); function getPointerDistance() { const points = [...activePointers.values()]; if (points.length < 2) { return 0; } const dx = points[0].x - points[1].x; const dy = points[0].y - points[1].y; return Math.sqrt( dx * dx + dy * dy ); } editor.addEventListener( "pointerup", (event) => { activePointers.delete( event.pointerId ); if (activePointers.size < 2) { pinchStartDistance = 0; } } ); editor.addEventListener( "pointercancel", (event) => { activePointers.delete( event.pointerId ); if (activePointers.size < 2) { pinchStartDistance = 0; } } ); /* ===================================================== ROTELLA MOUSE = ZOOM ===================================================== */ editor.addEventListener( "wheel", (event) => { event.preventDefault(); const oldScale = scale; const amount = event.deltaY > 0 ? 0.95 : 1.05; scale = Math.min( parseFloat(zoom.max), Math.max( parseFloat(zoom.min), scale * amount ) ); zoom.value = scale; const factor = scale / oldScale; const centerX = editor.clientWidth / 2; const centerY = editor.clientHeight / 2; x = centerX + (x - centerX) * factor; y = centerY + (y - centerY) * factor; constrainPosition(); updateImage(); }, { passive: false } ); /* ===================================================== ESPORTAZIONE 600 × 800 ===================================================== */ /* * Questa funzione verrà utilizzata * nel prossimo passaggio per creare * il JPEG esattamente come lo vedi * nella cornice. */ async function createInstaxImage() { const WIDTH = 600; const HEIGHT = 800; const canvas = document.createElement("canvas"); canvas.width = WIDTH; canvas.height = HEIGHT; const ctx = canvas.getContext("2d"); ctx.fillStyle = "white"; ctx.fillRect( 0, 0, WIDTH, HEIGHT ); /* * Rapporto tra il canvas di anteprima * e il canvas finale. */ const factorX = WIDTH / editor.clientWidth; const factorY = HEIGHT / editor.clientHeight; /* * Posizione dell'immagine */ const drawWidth = imageWidth * scale * factorX; const drawHeight = imageHeight * scale * factorY; const drawX = x * factorX - drawWidth / 2; const drawY = y * factorY - drawHeight / 2; ctx.drawImage( image, drawX, drawY, drawWidth, drawHeight ); return new Promise( resolve => { canvas.toBlob( resolve, "image/jpeg", 0.9 ); } ); } </script> </body> </html>
