<!DOCTYPE html> <html lang="it"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>INSTAX Mini Link 2</title> <style> * { box-sizing: border-box; } body { margin: 0; padding: 25px 15px; background: #f4f4f4; font-family: Arial, sans-serif; color: #222; } .container { max-width: 500px; margin: auto; } h1 { text-align: center; margin-bottom: 5px; } .subtitle { text-align: center; color: #777; margin-top: 0; } .card { background: white; padding: 25px; border-radius: 20px; margin-top: 20px; box-shadow: 0 5px 20px #0002; } button, label { display: block; width: 100%; padding: 15px; margin-top: 15px; border: 0; border-radius: 12px; font-size: 16px; font-weight: bold; text-align: center; cursor: pointer; } #connect { background: #222; color: white; } #photoButton { background: #eee; color: #222; } input { display: none; } #status { margin-top: 15px; padding: 12px; background: #eee; border-radius: 10px; text-align: center; font-size: 14px; } #previewContainer { margin-top: 20px; text-align: center; } #preview { max-width: 100%; max-height: 500px; border-radius: 8px; box-shadow: 0 3px 15px #0003; } #info { margin-top: 15px; padding: 12px; background: #f0f0f0; border-radius: 10px; font-size: 14px; line-height: 1.6; } #ready { margin-top: 15px; padding: 12px; background: #dff5df; color: #176b17; border-radius: 10px; text-align: center; font-weight: bold; display: none; } </style> </head> <body> <div class="container"> <h1>INSTAX Mini Link 2</h1> <p class="subtitle"> Preparazione foto </p> <div class="card">
<button id="connect">
  📶 Connetti Mini Link 2
</button>

<div id="status">
  Stampante non collegata
</div>

<label id="photoButton" for="photo">
  📷 Scegli una foto
</label>

<input
  id="photo"
  type="file"
  accept="image/*"
>

<div id="previewContainer"></div>

<div id="info"></div>

<div id="ready">
  ✅ Foto pronta per la Mini Link 2
</div>

</div> </div> <script> const connectButton = document.getElementById("connect"); const photoInput = document.getElementById("photo"); const statusElement = document.getElementById("status"); const previewContainer = document.getElementById("previewContainer"); const infoElement = document.getElementById("info"); const readyElement = document.getElementById("ready"); let bluetoothDevice = null; let bluetoothServer = null; /* * ========================= * BLUETOOTH * ========================= */ connectButton.addEventListener("click", async () => { if (!navigator.bluetooth) { statusElement.textContent = "❌ Web Bluetooth non supportato."; return; } try { statusElement.textContent = "🔍 Ricerca Mini Link 2..."; bluetoothDevice = await navigator.bluetooth.requestDevice({ filters: [ { namePrefix: "INSTAX" } ], optionalServices: [ "0000ff00-0000-1000-8000-00805f9b34fb" ] }); statusElement.textContent = "📡 Connessione a " + (bluetoothDevice.name || "INSTAX") + "..."; bluetoothServer = await bluetoothDevice.gatt.connect(); statusElement.textContent = "✅ Mini Link 2 collegata"; connectButton.textContent = "✅ Stampante collegata"; connectButton.disabled = true; } catch (error) { console.error(error); statusElement.textContent = "❌ " + error.message; } }); /* * ========================= * FOTO * ========================= */ photoInput.addEventListener("change", async () => { const file = photoInput.files[0]; if (!file) { return; } readyElement.style.display = "none"; infoElement.textContent = "⏳ Elaborazione foto..."; try { const image = await loadImage(file); /* * INSTAX Mini: * * 600 × 800 * * rapporto 3:4 */ const WIDTH = 600; const HEIGHT = 800; const canvas = document.createElement("canvas"); canvas.width = WIDTH; canvas.height = HEIGHT; const ctx = canvas.getContext("2d"); /* * Sfondo bianco */ ctx.fillStyle = "#ffffff"; ctx.fillRect( 0, 0, WIDTH, HEIGHT ); /* * Ritaglio "cover" * * Mantiene il rapporto 3:4 * riempiendo completamente * il formato INSTAX. */ const sourceRatio = image.width / image.height; const targetRatio = WIDTH / HEIGHT; let sourceWidth; let sourceHeight; let sourceX; let sourceY; if (sourceRatio > targetRatio) { sourceHeight = image.height; sourceWidth = image.height * targetRatio; sourceX = (image.width - sourceWidth) / 2; sourceY = 0; } else { sourceWidth = image.width; sourceHeight = image.width / targetRatio; sourceX = 0; sourceY = (image.height - sourceHeight) / 2; } /* * Disegna la foto */ ctx.drawImage( image, sourceX, sourceY, sourceWidth, sourceHeight, 0, 0, WIDTH, HEIGHT ); /* * Mostra anteprima */ previewContainer.innerHTML = ""; const preview = document.createElement("img"); preview.id = "preview"; preview.src = canvas.toDataURL("image/jpeg", 0.90); previewContainer.appendChild(preview); /* * Comprimi JPEG */ const jpeg = await canvasToBlob( canvas, 0.90 ); /* * Mostra informazioni */ const sizeKB = jpeg.size / 1024; infoElement.innerHTML = ` <strong>Foto originale</strong><br> ${image.width} × ${image.height} px <br><br> <strong>Formato INSTAX</strong><br> 600 × 800 px <br><br> <strong>JPEG preparato</strong><br> ${sizeKB.toFixed(1)} KB `; /* * Controllo dimensione */ if (sizeKB > 105) { infoElement.innerHTML += ` <br><br> ⚠️ Il file è superiore a 105 KB. `; } else { readyElement.style.display = "block"; } /* * Salviamo il JPEG * per il prossimo passaggio. */ window.instaxImage = jpeg; } catch (error) { console.error(error); infoElement.textContent = "❌ Errore durante la preparazione della foto."; } }); /* * ========================= * CARICA IMMAGINE * ========================= */ function loadImage(file) { return new Promise((resolve, reject) => { const image = new Image(); image.onload = () => { URL.revokeObjectURL(image.src); resolve(image); }; image.onerror = reject; image.src = URL.createObjectURL(file); }); } /* * ========================= * CANVAS → JPEG * ========================= */ function canvasToBlob( canvas, quality ) { return new Promise((resolve) => { canvas.toBlob( resolve, "image/jpeg", quality ); }); } </script> </body> </html>
